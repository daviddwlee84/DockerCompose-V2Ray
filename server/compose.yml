# Reference copy of the deployed stack, in its DEFAULT shape:
# vpn_protocol: reality → Xray owns 443, nginx keeps 80 for the landing page,
# and no Let's Encrypt certificate is involved. The Ansible-rendered version
# (ansible/roles/vpn/templates/compose.yml.j2) also covers the vmess_ws / both
# modes, where nginx takes 443 (or vmess_ws_port) back and certbot returns.
services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./runtime/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./static/nginx/html:/usr/share/nginx/html:ro
      - ./runtime/logs/nginx:/var/log/nginx
      - ./runtime/certbot/conf:/etc/letsencrypt
      - ./runtime/certbot/www:/var/www/certbot
    ports:
      - "80:80"
    links:
      - xray:xray
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Distroless image running as uid 65532: no shell inside (`docker logs xray`,
  # not `exec`). Default CMD is `-confdir /usr/local/etc/xray/`, so the config
  # mount needs no command override. 443 is published to an unprivileged
  # in-container port so the non-root user never binds a low port.
  xray:
    image: ghcr.io/xtls/xray-core:26.3.27
    container_name: xray
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    restart: always
    volumes:
      - ./runtime/xray:/usr/local/etc/xray:ro
      - ./runtime/logs/xray:/var/log/xray
    ports:
      - "443:8443"

  # --- Observability agent + exporters ---
  # Reference copy. In the Ansible-rendered compose these services are gated
  # behind `monitoring_enabled` (see roles/vpn/templates/compose.yml.j2). All are
  # internal to the compose network (expose:, never ports:). Grafana Alloy scrapes
  # them locally and ships metrics + logs OUTBOUND to the central obs host; the
  # endpoint + push credentials live in the generated ./runtime/alloy/config.alloy.
  v2ray-exporter:
    image: wi1dcard/v2ray-exporter:master
    container_name: v2ray-exporter
    restart: unless-stopped
    command: ["--v2ray-endpoint", "xray:10085"]
    expose:
      - "9550"
    depends_on:
      - xray

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:8081/nginx_status"
    expose:
      - "9113"
    depends_on:
      - nginx

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    user: root
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./runtime/alloy:/etc/alloy:ro
      - ./runtime/logs/nginx:/var/log/nginx:ro
      - ./runtime/logs/xray:/var/log/xray:ro
      - alloy-data:/var/lib/alloy/data
    expose:
      - "12345"
    depends_on:
      - v2ray-exporter
      - node-exporter
      - cadvisor
      - nginx-exporter

volumes:
  alloy-data:
