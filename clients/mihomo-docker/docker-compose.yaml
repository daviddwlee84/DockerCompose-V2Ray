# Mihomo (Clash Meta) — VLESS Reality capable Docker client. DEFAULT stack.
# Uses the official MetaCubeX image. On hosts that cannot reach Docker Hub,
# use docker-compose.binary.yaml instead (alpine + bind-mounted binary).
#
# Side-by-side with legacy Dreamacro Clash (clients/docker): use different host ports.
#
# Rootless Docker:
#   export DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock
#
# Config:
#   cp config.example.yaml config.yaml   # fill UUID / Reality keys
#
#   docker compose up -d
#   export https_proxy=http://127.0.0.1:7890 http_proxy=http://127.0.0.1:7890
#   curl -x http://127.0.0.1:7890 https://api.ipify.org

services:
  mihomo:
    # Multi-arch (amd64 / arm64 / arm/v7 / 386). Pinned on purpose — :latest
    # moves on every upstream release. :Alpha tracks the Alpha branch.
    image: metacubex/mihomo:v1.19.29
    container_name: mihomo
    restart: unless-stopped
    # No entrypoint override: the image's ENTRYPOINT is /mihomo and its default
    # config dir is already /root/.config/mihomo.
    # No Country.mmdb mount either: the image ships geoip.metadb + geosite.dat
    # + geoip.dat under that dir (declared as a VOLUME), so GEOIP rules work
    # out of the box.
    volumes:
      - ./config.yaml:/root/.config/mihomo/config.yaml:ro
    ports:
      # Mixed HTTP+SOCKS (legacy clash often uses 7892 when both run)
      - "7890:7890"
      # External controller (legacy clash keeps 9090)
      - "9091:9091"
