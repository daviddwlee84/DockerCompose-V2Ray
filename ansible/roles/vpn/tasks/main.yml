---
# Renders templates and syncs compose.yml + static assets into {{ deploy_path }}
# on the VPS. Does NOT bring up compose — the letsencrypt role does that after
# ensuring a cert exists (in `reality` mode there is no cert to wait for, but it
# is still the one place that runs `docker compose up`).

- name: Validate vpn_protocol
  ansible.builtin.assert:
    that: vpn_protocol in ['reality', 'vmess_ws', 'both']
    fail_msg: >-
      vpn_protocol must be one of reality / vmess_ws / both (got
      {{ vpn_protocol | default('undefined') }}). See docs/REALITY-MIGRATION.md.

# Without this, a host whose vault predates the REALITY migration renders an
# Xray config with an empty privateKey. Xray starts, accepts TCP, and silently
# fails every handshake — which looks exactly like being blocked. Fail loudly
# at deploy time instead.
- name: Require REALITY key material for the selected protocol
  when: vpn_protocol in ['reality', 'both']
  ansible.builtin.assert:
    that:
      - reality_private_key | default('') | length > 0
      - reality_public_key | default('') | length > 0
      - reality_short_id | default('') | length > 0
    fail_msg: >-
      vpn_protocol={{ vpn_protocol }} needs vault_reality_private_key /
      vault_reality_public_key / vault_reality_short_id in this host's vault.
      Generate them with `scripts/reality_keys.py` and add them via
      `just vault-edit {{ inventory_hostname }}`, or re-run
      `scripts/az_configure.py --force` to regenerate the vault.

- name: Create deploy directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ deploy_path }}"
    - "{{ deploy_path }}/static"
    - "{{ deploy_path }}/runtime"
    - "{{ deploy_path }}/runtime/nginx/conf.d"
    - "{{ deploy_path }}/runtime/xray"
    - "{{ deploy_path }}/runtime/certbot/conf"
    - "{{ deploy_path }}/runtime/certbot/www"
    - "{{ deploy_path }}/runtime/logs/nginx"
    - "{{ deploy_path }}/runtime/alloy"

# Owned by the image's nonroot uid, not by ansible_user: ghcr.io/xtls/xray-core
# runs as 65532 and cannot write into a dir owned by anyone else. Without this
# Xray exits at startup with a permission error on access.log.
- name: Create Xray log directory owned by the container's nonroot uid
  ansible.builtin.file:
    path: "{{ deploy_path }}/runtime/logs/xray"
    state: directory
    owner: "65532"
    group: "65532"
    mode: "0755"

- name: Install logrotate config for nginx + xray logs
  ansible.builtin.template:
    src: logrotate-vpn.conf.j2
    dest: /etc/logrotate.d/vpn
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Sync static assets (nginx landing page)
  ansible.posix.synchronize:
    src: "{{ vpn_static_src }}/"
    dest: "{{ deploy_path }}/static/"
    delete: true
    recursive: true
    # Propagate the inventory-declared private key to rsync's SSH wrapper;
    # synchronize doesn't auto-read ansible_private_key_file when delegated
    # to localhost. `omit` keeps the original behaviour (agent/default key)
    # when the var isn't set.
    private_key: "{{ ansible_private_key_file | default(ansible_ssh_private_key_file) | default(omit) }}"
  delegate_to: localhost
  become: false

- name: Render compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ deploy_path }}/compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: recreate stack

# 0640 owned by 65532 rather than by ansible_user: the config carries the UUID
# and the REALITY private key, so it must not be world-readable, but the
# container user has to be able to read it through the :ro bind mount.
- name: Render Xray config
  ansible.builtin.template:
    src: xray/config.json.j2
    dest: "{{ deploy_path }}/runtime/xray/config.json"
    owner: "65532"
    group: "65532"
    mode: "0640"
  notify: restart xray

- name: Remove superseded V2Ray runtime config
  ansible.builtin.file:
    path: "{{ deploy_path }}/runtime/v2ray"
    state: absent

- name: Render Grafana Alloy agent config (monitoring)
  when: monitoring_enabled | bool
  ansible.builtin.template:
    src: alloy/config.alloy.j2
    dest: "{{ deploy_path }}/runtime/alloy/config.alloy"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  notify: recreate stack

- name: Check if Let's Encrypt cert already exists
  ansible.builtin.stat:
    path: "{{ deploy_path }}/runtime/certbot/conf/live/{{ domain }}/fullchain.pem"
  register: le_cert

# ACME-only bootstrap applies solely to the modes that need a certificate; the
# default `reality` mode goes straight to its final config.
- name: Render nginx configs
  ansible.builtin.include_tasks: nginx_conf.yml
  vars:
    nginx_acme_only: "{{ letsencrypt_enabled | bool and not le_cert.stat.exists }}"
