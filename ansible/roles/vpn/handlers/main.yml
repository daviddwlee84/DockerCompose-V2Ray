---
- name: Reload nginx
  community.docker.docker_container_exec:
    container: nginx
    command: nginx -s reload
  listen: reload nginx

- name: Restart xray
  community.docker.docker_container:
    name: xray
    state: started
    restart: true
  listen: restart xray

- name: Recreate compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_path }}"
    state: present
  listen: recreate stack
